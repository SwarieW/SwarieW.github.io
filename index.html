<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio | William Halim</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #001122;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            cursor: default;
        }

        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* UI PROFILE CARD */
        .portfolio-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            z-index: 10;
            text-align: center;
            background: rgba(4, 18, 30, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 255, 0.15);
            border-radius: 20px;
            padding: 40px 50px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 255, 255, 0.05);
            color: #e0f7fa;
            width: 85%;
            max-width: 350px;
            opacity: 0; /* Disembunyikan di awal */
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .portfolio-container.active {
            opacity: 1; /* Tampil saat active */
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .profile-photo-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(135deg, #00ffcc, #0088aa);
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .profile-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #04121e;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.8em;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.4);
        }

        p.bio {
            margin: 0 0 30px 0;
            font-size: 0.95em;
            color: #80deea;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 8px 24px;
            background: transparent;
            border: 1px solid rgba(255, 50, 50, 0.6);
            border-radius: 30px;
            font-size: 0.8em;
            font-weight: bold;
            color: #ffcccc;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 10px rgba(255, 50, 50, 0.2), inset 0 0 10px rgba(255, 50, 50, 0.1);
        }

        .status-badge .dot {
            width: 6px;
            height: 6px;
            background-color: #ff3333;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 8px #ff3333;
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.5; box-shadow: 0 0 4px #ff3333; }
            50% { opacity: 1; box-shadow: 0 0 12px #ff3333; }
            100% { opacity: 0.5; box-shadow: 0 0 4px #ff3333; }
        }

        #interaction-hint {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(0, 255, 204, 0.7);
            font-size: 0.9em;
            pointer-events: none;
            z-index: 5;
            letter-spacing: 1px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    
    <div id="interaction-hint">Klik BTS Tengah untuk Membuka Profil</div>

    <div class="portfolio-container" id="profileCard">
        <div class="profile-photo-wrapper">
            <!-- Ganti src di bawah dengan link/path fotomu aslimu -->
            <img src="ProfilePict.png" alt="William Halim" class="profile-photo">
        </div>
        <h1>William Halim</h1>
        <p class="bio">Developer & Network Enthusiast.</p>
        
        <div class="status-badge">
            <span class="dot"></span> IN DEVELOPMENT
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const card = document.getElementById('profileCard');
        const hint = document.getElementById('interaction-hint');
        let w, h, groundLevel, seabedLevel;

        let towers = [], pulses = [], fishes = [], rainDrops = [];
        let frameCount = 0;
        let cloudOffset = 0;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            groundLevel = h * 0.55; // Garis tanah
            seabedLevel = h * 0.95; // Dasar laut
            init(); 
        }
        window.addEventListener('resize', resize);

        // --- SISTEM INTERAKSI KLIK ---
        let isHoveringCenter = false;
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            
            const centerT = towers.find(t => t.isCenter);
            if (centerT) {
                // Deteksi hitbox BTS tengah (diperlebar sedikit agar nyaman)
                if (Math.abs(mouseX - centerT.x) < 40 && mouseY > groundLevel - centerT.th - 20 && mouseY <= groundLevel) {
                    canvas.style.cursor = 'pointer';
                    isHoveringCenter = true;
                } else {
                    canvas.style.cursor = 'default';
                    isHoveringCenter = false;
                }
            }
        });

        canvas.addEventListener('click', (e) => {
            if (isHoveringCenter) {
                // Membuka UI Card
                card.classList.add('active');
                hint.style.display = 'none';
            } else if (!card.contains(e.target)) {
                // Menutup UI Card jika klik di luar
                card.classList.remove('active');
                hint.style.display = 'block';
            }
        });

        function init() {
            towers = []; pulses = []; fishes = []; rainDrops = [];
            
            // Susunan Tower BTS (Side-View)
            let centerTh = 100;
            towers.push({ x: w / 2, y: groundLevel, isCenter: true, th: centerTh, tw: 30, cooldown: 0 });
            
            const gap = Math.min(w * 0.2, 200);
            const satTh = 60; const satTw = 15;
            towers.push({ x: w / 2 - gap, y: groundLevel, isCenter: false, th: satTh, tw: satTw, cooldown: 0 });
            towers.push({ x: w / 2 - gap * 2, y: groundLevel, isCenter: false, th: satTh, tw: satTw, cooldown: 0 });
            towers.push({ x: w / 2 + gap, y: groundLevel, isCenter: false, th: satTh, tw: satTw, cooldown: 0 });
            towers.push({ x: w / 2 + gap * 2, y: groundLevel, isCenter: false, th: satTh, tw: satTw, cooldown: 0 });

            // Setup Ikan Robot Bawah Air
            for (let i = 0; i < 5; i++) {
                fishes.push({
                    x: Math.random() * w,
                    y: groundLevel + 40 + Math.random() * (seabedLevel - groundLevel - 80),
                    vx: (Math.random() > 0.5 ? 1 : -1) * (0.5 + Math.random()),
                    vy: 0, targetVy: 0, size: 20 + Math.random() * 10,
                    timer: Math.random() * 100, wifiTick: Math.random() * 100
                });
            }

            // Hujan Angka Biner
            for (let i = 0; i < 40; i++) {
                rainDrops.push({
                    x: Math.random() * w, y: Math.random() * groundLevel,
                    v: 1 + Math.random() * 1.5, char: Math.random() > 0.5 ? '0' : '1'
                });
            }
        }

        class Pulse {
            constructor(x, y, maxR, isCenter) {
                this.x = x; this.y = y; this.r = 10;
                this.maxR = maxR; this.speed = isCenter ? 2.5 : 1.5;
                this.isCenter = isCenter; this.active = true;
            }

            update() {
                this.r += this.speed;
                if (this.r > this.maxR) this.active = false;

                if (this.isCenter) {
                    towers.forEach(t => {
                        if (!t.isCenter && t.cooldown <= 0) {
                            let dist = Math.abs(this.x - t.x);
                            if (Math.abs(this.r - dist) < this.speed + 1) {
                                pulses.push(new Pulse(t.x, t.y - t.th, 200, false));
                                t.cooldown = 120;
                            }
                        }
                    });
                }
            }

            draw(ctx) {
                let ratio = this.r / this.maxR;
                let cR, cG, cB = 0;

                // Gradien Pulse: Hijau -> Merah -> Fade
                if (ratio < 0.5) {
                    let localRatio = ratio / 0.5;
                    cR = Math.floor(localRatio * 255);
                    cG = Math.floor((1 - localRatio) * 150 + 100);
                } else {
                    let localRatio = (ratio - 0.5) / 0.5;
                    cR = Math.floor((1 - localRatio) * 255 + localRatio * 50);
                    cG = 0;
                }

                ctx.save();
                ctx.beginPath();
                // Arc Math.PI ke 0 membuat lengkungan menghadap ke ATAS
                ctx.arc(this.x, this.y, this.r, Math.PI, 0);
                ctx.strokeStyle = `rgba(${cR}, ${cG}, ${cB}, ${1 - ratio})`;
                ctx.lineWidth = this.isCenter ? 3 : 1.5;
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawEnvironment() {
            // Langit
            let skyGrad = ctx.createLinearGradient(0, 0, 0, groundLevel);
            skyGrad.addColorStop(0, '#001122'); skyGrad.addColorStop(1, '#002233');
            ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, w, groundLevel);

            // Bawah Tanah / Air
            let seaGrad = ctx.createLinearGradient(0, groundLevel, 0, h);
            seaGrad.addColorStop(0, '#001a33'); seaGrad.addColorStop(1, '#000511');
            ctx.fillStyle = seaGrad; ctx.fillRect(0, groundLevel, w, h - groundLevel);

            // Garis pembatas
            ctx.strokeStyle = '#ffff00'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, groundLevel); ctx.lineTo(w, groundLevel); ctx.stroke();
            
            ctx.strokeStyle = '#00aaff'; 
            ctx.beginPath(); ctx.moveTo(0, seabedLevel); ctx.lineTo(w, seabedLevel); ctx.stroke();
            
            // Tekstur air seabed
            ctx.strokeStyle = '#00aaff'; ctx.lineWidth = 2;
            for(let i=0; i<w; i+=40) {
                ctx.beginPath(); ctx.moveTo(i, seabedLevel + 10); ctx.lineTo(i - 20, h); ctx.stroke();
            }

            // Awan & Kode
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.font = '14px monospace';
            cloudOffset -= 0.3;
            if (cloudOffset < -w) cloudOffset = 0;
            
            const cloudCode = "01001100 01001111 01000001 01000100 01001001 01001110 01000111";
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.arc(cloudOffset + w*i + 100, 50, 40, 0, Math.PI*2);
                ctx.arc(cloudOffset + w*i + 150, 40, 50, 0, Math.PI*2);
                ctx.arc(cloudOffset + w*i + 200, 50, 40, 0, Math.PI*2);
                ctx.fill();
                
                ctx.fillStyle = 'rgba(0, 255, 204, 0.3)';
                ctx.fillText(cloudCode, cloudOffset + w*i + 80, 50);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            }

            // Hujan 01
            ctx.fillStyle = 'rgba(255, 50, 50, 0.4)';
            ctx.font = '12px monospace';
            rainDrops.forEach(drop => {
                ctx.fillText(drop.char, drop.x, drop.y);
                drop.y += drop.v;
                if (frameCount % 15 === 0 && Math.random() > 0.8) drop.char = Math.random() > 0.5 ? '0' : '1';
                if (drop.y > groundLevel) drop.y = 0;
            });

            // Ikan Robot
            fishes.forEach(f => {
                f.x += f.vx; f.y += f.vy;
                if (f.x < -50) f.x = w + 50; if (f.x > w + 50) f.x = -50;
                if (f.y < groundLevel + 20) f.y = groundLevel + 20;
                if (f.y > seabedLevel - 20) f.y = seabedLevel - 20;

                f.timer++;
                if (f.timer > 80) {
                    f.timer = 0;
                    f.vx = Math.sign(f.vx) * (0.8 + Math.random());
                    f.targetVy = (Math.random() - 0.5) * 0.8;
                }
                f.vy += (f.targetVy - f.vy) * 0.1; f.wifiTick += 2;

                ctx.save(); ctx.globalAlpha = 0.4; ctx.translate(f.x, f.y);
                ctx.strokeStyle = '#3366ff'; ctx.lineWidth = 2;
                ctx.beginPath();
                if (f.vx > 0) {
                    ctx.moveTo(f.size, 0); ctx.lineTo(-f.size, -f.size/2); ctx.lineTo(-f.size, f.size/2); ctx.closePath(); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(-f.size, 0); ctx.lineTo(-f.size*1.5, -f.size/2); ctx.lineTo(-f.size*1.5, f.size/2); ctx.closePath(); ctx.stroke();
                } else {
                    ctx.moveTo(-f.size, 0); ctx.lineTo(f.size, -f.size/2); ctx.lineTo(f.size, f.size/2); ctx.closePath(); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(f.size, 0); ctx.lineTo(f.size*1.5, -f.size/2); ctx.lineTo(f.size*1.5, f.size/2); ctx.closePath(); ctx.stroke();
                }
                
                ctx.strokeStyle = '#3366ff'; ctx.lineWidth = 1.5;
                let wifiCycle = (f.wifiTick % 100) / 100;
                for (let i = 1; i <= 3; i++) {
                    if (wifiCycle * 3 > i - 1) {
                        ctx.beginPath(); ctx.arc(0, -f.size * 0.8, i * 5, Math.PI * 1.25, Math.PI * 1.75); ctx.stroke();
                    }
                }
                ctx.restore();
            });
        }

        function drawInfrastructure() {
            // Fiber Backbone
            let centerT = towers.find(t => t.isCenter);
            if (centerT) {
                let grad = ctx.createLinearGradient(centerT.x, seabedLevel, centerT.x, groundLevel);
                grad.addColorStop(0, '#00ff00'); grad.addColorStop(1, '#ff0000');
                
                ctx.strokeStyle = grad; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(centerT.x, seabedLevel); ctx.lineTo(centerT.x, groundLevel); ctx.stroke();
            }

            // Struktur BTS
            towers.forEach(t => {
                ctx.save(); ctx.translate(t.x, t.y);
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-t.tw/2, 0); ctx.lineTo(0, -t.th);
                ctx.moveTo(t.tw/2, 0); ctx.lineTo(0, -t.th);
                ctx.moveTo(-t.tw/3, -t.th/3); ctx.lineTo(t.tw/3, -t.th/3);
                ctx.moveTo(-t.tw/6, -t.th*2/3); ctx.lineTo(t.tw/6, -t.th*2/3);
                ctx.stroke();

                // Efek Neon jika kursor Hover BTS Tengah
                if (t.isCenter && isHoveringCenter) {
                    ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 15;
                    ctx.strokeStyle = '#00ffcc'; ctx.stroke();
                } else if (t.isCenter) {
                     ctx.shadowColor = 'rgba(255,255,255,0.3)'; ctx.shadowBlur = 5;
                     ctx.strokeStyle = '#ffffff'; ctx.stroke();
                } else {
                     ctx.strokeStyle = '#ffffff'; ctx.stroke();
                }
                ctx.restore();
            });
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            drawEnvironment(); drawInfrastructure();

            let centerT = towers.find(t => t.isCenter);
            if (centerT && frameCount % 120 === 0) {
                pulses.push(new Pulse(centerT.x, centerT.y - centerT.th, Math.max(w, h) * 0.6, true));
            }

            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update(); pulses[i].draw(ctx);
                if (!pulses[i].active) pulses.splice(i, 1);
            }

            towers.forEach(t => { if(t.cooldown > 0) t.cooldown--; });

            frameCount++;
            requestAnimationFrame(animate);
        }

        resize(); animate();
    </script>
</body>
</html>
